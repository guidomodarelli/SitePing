name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version selection for changed packages'
        required: true
        type: choice
        default: suggested
        options: [suggested, patch, minor, major]
      dry_run:
        description: 'Show the release plan without changing versions, tags or npm'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  create-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Configure release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Plan or publish workspace releases
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh auth setup-git --hostname github.com
          args=()
          if [ "$RELEASE_BUMP" = 'suggested' ]; then
            args+=(--accept-suggested)
          else
            args+=(--bump "$RELEASE_BUMP")
          fi
          if [ "$RELEASE_DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          bun run create-version "${args[@]}"

      - name: Verify npm publications
        if: ${{ !inputs.dry_run }}
        run: node scripts/verify-npm-publish.mjs

  github-release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Create GitHub release from the package changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        # A release pushes all package tags atomically; GitHub suppresses tag
        # events when more than three arrive, so reconcile from the main event.
        run: |
          while IFS= read -r tag; do
            node scripts/release/github-release.mjs "$tag"
          done < <(git tag --points-at HEAD --list '*-v*')
